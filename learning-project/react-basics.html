<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      const name = "Methmi";
      const socksPrice = 10;
      const tshirtPrice = 8;
      const shippingCost = 5;

      const productCost = socksPrice + 2 * tshirtPrice;
      const totalCost = productCost + shippingCost;

      console.log("Total Product Cost:", productCost);

      //1g.use dayjs to get the current date and log it to the console
      const today = dayjs().format(`MMMM D`);
      console.log("Today's Date: -", today);

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);

      setInterval(() => {
        const time_now = dayjs().format(`HH:mm:ss`);
        console.log("Current Time :- ", time_now);

        const div = (
          <div>
            <button>Good Job!</button>
            <br />

            <p>My name is {name}</p>
            <br />
            <br />

            <p>Cotton Socks are the best!</p>
            <p>Price: ${socksPrice}</p>
            <p>T-Shirts Price: ${tshirtPrice}</p>
            <p>Socks + 2 T-Shirts = ${productCost}</p>
            <p>Shipping Cost: ${shippingCost}</p>
            <p>
              <strong>Total Cost: ${totalCost}</strong>
            </p>

            <br />

            <button>Add to Cart</button>
            <br />
            <button>Hello</button>

            <p>This is a paragraph created using React. {2 + 4}</p>
            <p>Today is {today}</p>
            <p>Current Time is {time_now}</p>
          </div>
        );
        //use the root variable to render the updated jsx
        root.render(div);
      }, 1000);
    </script>
  </body>
</html>
