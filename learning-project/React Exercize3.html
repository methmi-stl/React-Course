<!DOCTYPE html>
<html>
  <head>
    <title>Exercise html</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      //1. Define Reusable component for Product Details
      function ProductDetails(props) {
        const { name, price, discountPrice,imageSrc} =props;
        
        return (
          <div style={{ marginBottom: "30px", border: `1px solid #ccc`, padding:'10px', width: '200px'}}>
            {/*Adding the image at the top */}
            <img src={imageSrc} alt ={name} style= {{width: '100%'}} />
            <h2 style={{ color: "blue" }}>{name}</h2>
            <p>Price :{discountPrice ? <del>${price}</del>: `$${price}`} </p>
            {discountPrice && (
                <p>Discount price : ${discountPrice}</p>
            )}
            <button>Add to Cart</button>
          </div>
        );
      }

      //Use the component inside the App component to display multiple products

      function App() {
        return (
          <>
            <h1>My Store - Product List </h1>
            <div style= {{ display:'flex', gap:'20px'}}>
                <ProductDetails 
                    name="Cotton Socks" 
                    price={10.99} 
                    discountPrice ={5.45} 
                    imageSrc="images/1.png"
                    />
                <ProductDetails name="Tennis Balls" price={6.0} imageSrc="./images/2.png" />
                <ProductDetails name="Plan T-Shirt" price={7.99} imageSrc="./images/3.png" />
            </div>
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
